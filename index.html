<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sauce Atlas — a pantry-first index of Asian sauces</title>
    <meta name="description" content="Filter sauces, dips and braise bases by what is actually in your pantry, by cuisine, and by taste." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Barlow+Condensed:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      /* Stamp the palette before first paint, so nobody sees the wrong paper for
         a frame. useAtlas.ts owns it from here on. */
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('sauce-atlas-theme')
        } catch (e) {
          /* file:// origin, no storage. Fall through to the system preference. */
        }
        document.documentElement.dataset.theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
